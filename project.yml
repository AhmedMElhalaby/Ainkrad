name: Ainkrad
options:
  bundleIdPrefix: com.ainkrad
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.13.0"

targets:
  Ainkrad:
    type: application
    platform: macOS
    sources:
      - path: Sources/Ainkrad
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_PREVIEWS: YES

  AinkradTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AinkradTests
    dependencies:
      - target: Ainkrad
        embed: false
      # SwiftTerm is deliberately NOT linked here: the test bundle loads the
      # host app, which already contains SwiftTerm. Linking it again
      # duplicates every ObjC class (runtime warning + crashes). Tests can
      # still `import SwiftTerm` — the module compiles against the build
      # products' .swiftmodule and links against the host at runtime.
      - package: SwiftTerm
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Ainkrad:
    build:
      targets:
        Ainkrad: all
        AinkradTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AinkradTests
