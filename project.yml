name: Ainkrad
options:
  bundleIdPrefix: com.ainkrad
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

packages:
  # AinkradAppKit — the Built-in App SDK (github.com/AhmedMElhalaby/AinkradAppKit).
  # DYNAMIC library: the host embeds one copy; plugin bundles resolve it at
  # runtime (a static copy per binary would break dynamic protocol casts).
  AinkradAppKit:
    url: https://github.com/AhmedMElhalaby/AinkradAppKit
    revision: 982fb593c6388cd51a178952375e02dd9c161877

targets:
  Ainkrad:
    type: application
    platform: macOS
    sources:
      - path: Sources/Ainkrad
    dependencies:
      # The host EMBEDS the one dynamic copy of AinkradAppKit into
      # Contents/Frameworks. Without embedding, a standalone .app crashes at
      # launch (dyld: "@rpath/AinkradAppKit.framework … no such file") — it only
      # resolved in dev via SwiftPM's build-tree PackageFrameworks rpath. Plugin
      # bundles link the same install name with embed:false and reuse this
      # already-loaded image at runtime.
      - package: AinkradAppKit
        embed: true
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.app
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_PREVIEWS: YES

  AinkradTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AinkradTests
    dependencies:
      - target: Ainkrad
        embed: false
      # AinkradAppKit is linked here: it's a
      # separate dynamic library two hops from the test bundle's
      # -bundle_loader (Ainkrad launcher -> Ainkrad.debug.dylib ->
      # AinkradAppKit.framework), so bundle_loader symbol resolution doesn't
      # reach it — tests that reference its symbols directly (e.g.
      # PluginLoaderTests) fail to link without this. It's pure Swift (no
      # ObjC classes), so linking it again carries none of SwiftTerm's
      # duplicate-class risk.
      - package: AinkradAppKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  HelloPlugin:
    type: bundle
    platform: macOS
    sources:
      - path: Samples/HelloPlugin
    dependencies:
      # Link against the SDK's symbols (needed to resolve protocol descriptors
      # at load time) but do NOT embed a second copy of the dylib — resolve
      # the host's copy at runtime, so protocol type metadata is shared and
      # the cast succeeds.
      - package: AinkradAppKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.plugin.hello
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Samples/HelloPlugin/Info.plist
        MACH_O_TYPE: mh_bundle
        # Loaded into the host process: find AinkradAppKit via the host executable.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"

schemes:
  Ainkrad:
    build:
      targets:
        Ainkrad: all
        AinkradTests: [test]
        HelloPlugin: [run]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AinkradTests
