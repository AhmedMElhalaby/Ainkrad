name: Ainkrad
options:
  bundleIdPrefix: com.ainkrad
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

packages:
  # SwiftTerm 1.13.0 fork (github.com/AhmedMElhalaby/SwiftTerm @ ainkrad-no-reflow).
  # Patches over upstream:
  #  - Buffer.resize: line-reflow disabled (upstream re-wrap duplicates output).
  #  - setFrameSize: off-live resizes are debounced (coalesce animated frame
  #    changes to one SIGWINCH); `applyResizeImmediately` opts a single clean
  #    snap (the Focus-Mode pane) out of the debounce; deferred resizes repaint.
  #  - Package.swift trimmed to the library product for stable resolution.
  SwiftTerm:
    url: https://github.com/AhmedMElhalaby/SwiftTerm
    revision: 8685618957cc9e565f4a561abb5a151bbe7aabc2

targets:
  Ainkrad:
    type: application
    platform: macOS
    sources:
      - path: Sources/Ainkrad
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_PREVIEWS: YES

  AinkradTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AinkradTests
    dependencies:
      - target: Ainkrad
        embed: false
      # SwiftTerm is deliberately NOT linked here: the test bundle loads the
      # host app, which already contains SwiftTerm. Linking it again
      # duplicates every ObjC class (runtime warning + crashes). Tests can
      # still `import SwiftTerm` — the module compiles against the build
      # products' .swiftmodule and links against the host at runtime.
      - package: SwiftTerm
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Ainkrad:
    build:
      targets:
        Ainkrad: all
        AinkradTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AinkradTests
